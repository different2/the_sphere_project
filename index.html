<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Globe with Custom Textures</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label>Texture:</label>
                <select id="textureSelect">
                    <option value="laughingMan">Laughing Man</option>
                    <option value="earth">Earth Map</option>
                    <option value="text">Text Message</option>
                    <option value="custom">Upload Image</option>
                </select>
            </div>
            <div class="file-upload">
                <input type="file" id="fileUpload" accept="image/*" style="display: none;">
            </div>

            <div class="control-group text-entry" id="textEntryGroup" style="display: none;">
                <label for="customTextInput">Your text:</label>
                <textarea id="customTextInput" maxlength="500" rows="3" placeholder="HELLO WORLD!">HELLO WORLD!</textarea>
            </div>

            <div class="control-group face-count-group" id="faceCountGroup" style="display: none;">
                <label>Faces:</label>
                <div class="radio-row">
                    <label class="radio-pill">
                        <input type="radio" name="faceCount" value="1" checked>
                        <span>1 (wrap)</span>
                    </label>
                    <label class="radio-pill">
                        <input type="radio" name="faceCount" value="2">
                        <span>2</span>
                    </label>
                    <label class="radio-pill">
                        <input type="radio" name="faceCount" value="3">
                        <span>3</span>
                    </label>
                    <label class="radio-pill">
                        <input type="radio" name="faceCount" value="4">
                        <span>4</span>
                    </label>
                    <label class="radio-pill">
                        <input type="radio" name="faceCount" value="6">
                        <span>6</span>
                    </label>
                </div>
            </div>

            <div class="control-group per-face-group" id="perFaceGroup" style="display: none;">
                <label>Per-face:</label>
                <div class="face-slots" id="faceSlots"></div>
            </div>

            <div class="control-group checkbox-row">
                <label for="useDotsToggle">Fibonacci dots:</label>
                <input type="checkbox" id="useDotsToggle">
            </div>

            <div class="control-group">
                <label for="spinType">Spin:</label>
                <select id="spinType">
                    <option value="randomized">Randomized (tumble)</option>
                    <option value="axis">Axis (like a stand)</option>
                </select>
            </div>

            <div class="control-group checkbox-row">
                <label for="pauseSpinToggle">Pause spin:</label>
                <input type="checkbox" id="pauseSpinToggle">
            </div>

            <div class="control-group">
                <label>Phi:</label>
                <input type="range" id="phi" min="0" max="6.28" step="0.01" value="0">
            </div>
            <div class="control-group">
                <label>Theta:</label>
                <input type="range" id="theta" min="0" max="6.28" step="0.01" value="0">
            </div>
            <div class="control-group">
                <label>Dot Count:</label>
                <input type="range" id="dots" min="1000" max="100000" step="1000" value="25000">
            </div>
            <div class="control-group">
                <label>Scale:</label>
                <input type="range" id="scale" min="0.5" max="1.5" step="0.05" value="1.0">
            </div>

            <div class="control-group export-group">
                <button type="button" id="exportGifBtn">Export Loopable GIF</button>
                <div id="exportStatus" class="export-status"></div>
            </div>
        </div>
        <div class="globe-container">
            <canvas id="globe"></canvas>
        </div>
    </div>
<script type="module" src="main.js"></script>
</body>
</html>
