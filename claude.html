<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Globe with Earth Texture</title>
    <style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Center the entire globe container in the viewport */
.container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100vh;
}

/* Holds the actual WebGL canvas */
.globe-container {
    position: relative;
    transition: all 0.1s ease-out;
}

canvas {
    width: 100vw;
    height: 100vh;
    transition: all 0.1s ease-out;
}

/* Controls stay fixed on the right like before */
.controls {
    position: fixed;
    top: 50%;
    right: 50px;
    transform: translateY(-50%);
    color: rgb(242, 239, 239);
    background: rgba(0, 0, 0, 0.8);
    padding: 20px;
    border-radius: 8px;
    font-size: 12px;
    min-width: 160px;
    z-index: 100;
}

.control-group {
    margin-bottom: 10px;
}

label {
    display: inline-block;
    width: 80px;
    text-align: left;
}

input[type="range"] {
    width: 120px;
    margin-left: 10px;
}

/* Debug panel in top-left, hidden by default */
.debug {
    position: fixed;
    top: 20px;
    left: 20px;
    color: white;
    background: rgba(0, 0, 0, 0.8);
    padding: 10px;
    border-radius: 8px;
    font-size: 10px;
    max-width: 200px;
    max-height: 150px;
    overflow-y: auto;
    z-index: 100;
    display: none;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label>Phi:</label>
                <input type="range" id="phi" min="0" max="6.28" step="0.01" value="0">
            </div>
            <div class="control-group">
                <label>Theta:</label>
                <input type="range" id="theta" min="0" max="6.28" step="0.01" value="0">
            </div>
            <div class="control-group">
                <label>Dots:</label>
                <input type="range" id="dots" min="1000" max="50000" step="1000" value="25000">
            </div>
            <div class="control-group">
                <label>Scale:</label>
                <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1.2">
            </div>
        </div>
        <div class="debug" id="debug">Loading...</div>
        <div class="globe-container">
            <canvas id="globe"></canvas>
        </div>
    </div>

        // Extended Phenomenon with texture support
        function extendPhenomenon() {
            const originalConstructor = Phenomenon;
            
            // Override the constructor to add sampler2D support
            window.Phenomenon = function(options) {
                const instance = new originalConstructor(options);
                
                // Add sampler2D support to uniformMap
                instance.uniformMap.sampler2D = function(location, textureUnit) {
                    instance.gl.uniform1i(location, textureUnit);
                };
                
                return instance;
            };
            
            // Copy all prototype methods
            window.Phenomenon.prototype = originalConstructor.prototype;
        }

        extendPhenomenon();

        // Fragment shader with texture sampling
        const fragmentShader = `
            precision highp float;
            uniform vec2 uResolution;
            uniform float phi;
            uniform float theta;
            uniform float dots;
            uniform float scale;
            uniform vec3 baseColor;
            uniform vec3 glowColor;
            uniform float dotsBrightness;
            uniform float diffuse;
            uniform float dark;
            uniform float opacity;
            uniform sampler2D uEarthTexture;

            const float sqrt5 = 2.23606797749979;
            const float PI = 3.141592653589793;
            const float kTau = 6.283185307179586;
            const float kPhi = 1.618033988749895;
            const float byLogPhiPlusOne = 0.7202100452062783;
            const float twoPiOnPhi = 3.8832220774509327;
            const float phiMinusOne = 0.618033988749895;
            const float r = 0.8;

            mat3 rotate(float theta, float phi) {
                float cx = cos(theta);
                float cy = cos(phi);
                float sx = sin(theta);
                float sy = sin(phi);

                return mat3(
                    cy, sy * sx, -sy * cx,
                    0., cx, sx,
                    sy, cy * -sx, cy * cx
                );
            }

            vec3 nearestFibonacciLattice(vec3 p, out float m) {
                p = p.xzy;
                
                float byDots = 1.0/dots;
                float k = max(2., floor(log2(sqrt5 * dots * PI * (1. - p.z * p.z)) * byLogPhiPlusOne));

                vec2 f = floor(pow(kPhi,k)/sqrt5*vec2(1.,kPhi)+0.5);
                vec2 br1 = fract((f+1.) * phiMinusOne)*kTau - twoPiOnPhi;
                vec2 br2 = -2.*f;
                vec2 sp = vec2(atan(p.y, p.x), p.z-1.);
                vec2 c = floor(vec2(br2.y * sp.x - br1.y * (sp.y * dots + 1.), -br2.x * sp.x + br1.x * (sp.y * dots + 1.)) / (br1.x*br2.y-br2.x*br1.y));
                
                float mindist = PI;
                vec3 minip;
                for (float s = 0.; s < 4.; s+=1.) {
                    vec2 o = vec2(mod(s, 2.), floor(s*0.5));
                    float idx = dot(f, c + o);
                    if (idx > dots) continue;

                    float tidx = idx;
                    float fracV = 0.;

                    // Optimized bit operations for pseudo-random distribution
                    if(tidx >= 524288.) { tidx-=524288.; fracV += 0.8038937048986554; }
                    if(tidx >= 262144.) { tidx-=262144.; fracV += 0.9019468524493277; }
                    if(tidx >= 131072.) { tidx-=131072.; fracV += 0.9509734262246639; }
                    if(tidx >= 65536.) { tidx-=65536.; fracV += 0.4754867131123319; }
                    if(tidx >= 32768.) { tidx-=32768.; fracV += 0.737743356556166; }
                    if(tidx >= 16384.) { tidx-=16384.; fracV += 0.868871678278083; }
                    if(tidx >= 8192.) { tidx-=8192.; fracV += 0.9344358391390415; }
                    if(tidx >= 4096.) { tidx-=4096.; fracV += 0.46721791956952075; }
                    if(tidx >= 2048.) { tidx-=2048.; fracV += 0.7336089597847604; }
                    if(tidx >= 1024.) { tidx-=1024.; fracV += 0.8668044798923802; }
                    if(tidx >= 512.) { tidx-=512.; fracV += 0.4334022399461901; }
                    if(tidx >= 256.) { tidx-=256.; fracV += 0.21670111997309505; }
                    if(tidx >= 128.) { tidx-=128.; fracV += 0.10835055998654752; }
                    if(tidx >= 64.) { tidx-=64.; fracV += 0.5541752799932738; }
                    if(tidx >= 32.) { tidx-=32.; fracV += 0.7770876399966369; }
                    if(tidx >= 16.) { tidx-=16.; fracV += 0.8885438199983184; }
                    if(tidx >= 8.) { tidx-=8.; fracV += 0.9442719099991592; }
                    if(tidx >= 4.) { tidx-=4.; fracV += 0.4721359549995796; }
                    if(tidx >= 2.) { tidx-=2.; fracV += 0.2360679774997898; }
                    if(tidx >= 1.) { tidx-=1.; fracV += 0.6180339887498949; }

                    float theta = fract(fracV) * kTau;
                    float cosphi = 1. - 2. * idx * byDots;
                    float sinphi = sqrt(1. - cosphi * cosphi);
                    vec3 sample = vec3(cos(theta) * sinphi, sin(theta) * sinphi, cosphi);

                    float dist = length(p - sample);
                    if (dist < mindist) {
                        mindist = dist;
                        minip = sample;
                    }
                }

                m = mindist;
                return minip.xzy;
            }

             void main() {
                vec2 uv = (gl_FragCoord.xy / uResolution) * 2.0 - 1.0;
                uv.x *= uResolution.x / uResolution.y;
                // Center the globe properly by adjusting the coordinate system
                uv /= scale;
                
                // Additional centering adjustment to ensure globe is at screen center
                uv.y *= -1.0; // Flip Y coordinate to match expected orientation

                float l = dot(uv, uv);
                vec4 color = vec4(0.);
                float glowFactor = 0.;

                if (l <= r * r) {
                    for (int side = 0; side <= 1; side++) {
                        vec4 layer = vec4(0.);
                        float dis;

                        vec3 light = vec3(0.,0.,1.);
                        vec3 p = normalize(vec3(uv, sqrt(r*r - l)));

                        p.z *= side > 0 ? -1. : 1.;
                        light.z *= side > 0 ? -1. : 1.;

                        vec3 rP = p * rotate(theta, phi);
                        vec3 gP = nearestFibonacciLattice(rP, dis);

                        // Convert 3D position to spherical coordinates for texture sampling
                        // Fix the upside-down issue by correcting the coordinate mapping
                        float gPhi = asin(clamp(gP.y, -1.0, 1.0));
                        float gTheta = atan(gP.z, gP.x);
                        
                        // Convert to texture coordinates (0-1) with proper orientation
                        vec2 texCoord = vec2(
                            (gTheta + PI) / (2.0 * PI),
                            1.0 - (gPhi + PI/2.0) / PI  // Flip Y to fix upside-down issue
                        );

                        vec4 earthColor = texture2D(uEarthTexture, texCoord);
                        
                        // Determine if this is land or ocean from the texture

                        float dotNL = dot(p, light);
                        float lighting = pow(max(dotNL, 0.0), diffuse) * dotsBrightness;

                        float colorFactor = mix((1. - totalSample) * pow(max(dotNL, 0.0), 0.4), totalSample, dark) + 0.1;

                        vec3 finalColor = earthColor.rgb;
                        
                        // Enhance ocean colors to be more blue
                        if (landMask < 0.5) {
                            finalColor = mix(finalColor, vec3(0.1, 0.3, 0.8), 0.6);
                        }
                        
                        layer += vec4(finalColor * colorFactor, 0.9); // Slightly transparent for spherical effect
                        layer.xyz += pow(1. - max(dotNL, 0.0), 4.) * glowColor;
                        
                        // Blend the layers with proper transparency
                        color += layer * (1. + (side > 0 ? -opacity * 0.8 : opacity)) / 2.;
                    }

                    glowFactor = pow(dot(normalize(vec3(-uv, sqrt(1.- l))), vec3(0.,0.,1.)), 4.) * smoothstep(0.,1.,0.2/(l-r*r));
                } else {
                    float outD = sqrt(0.2/(l - r * r));
                    glowFactor = smoothstep(0.5,1., outD / (outD + 1.));
                }

                gl_FragColor = color + vec4(glowFactor * glowColor, glowFactor);
            }
        `;

        const vertexShader = `
            attribute vec3 aPosition;
            uniform mat4 uProjectionMatrix;
            uniform mat4 uModelMatrix;
            uniform mat4 uViewMatrix;
            
            void main() {
                gl_Position = uProjectionMatrix * uModelMatrix * uViewMatrix * vec4(aPosition, 1.0);
            }
        `;

        debug("Shaders defined");

        // Canvas setup
        const canvas = document.getElementById('globe');
        let p, instance;
        
        function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            canvas.width = width;
            canvas.height = height;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            
            debug(`Canvas resized to: ${width}x${height}`);
            
            if (p && p.gl) {
                p.gl.viewport(0, 0, width, height);
                // Update resolution uniform if instance exists
                if (instance) {
                    const uniforms = {
                        uResolution: { type: "vec2", value: [width, height] }
                    };
                    // Update the resolution
                    p.uniforms.uResolution = { type: "vec2", value: [width, height] };
                }
            }
        }

        // Wait for DOM to be ready before sizing
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', resizeCanvas);
        } else {
            resizeCanvas();
        }

        // Create texture from base64 image
        function createTexture(gl, imageData) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = function() {
                    const texture = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                    debug("Earth texture created successfully");
                    resolve(texture);
                };
                image.onerror = function() {
                    debug("Failed to load texture image");
                    reject(new Error("Failed to load texture"));
                };
                image.src = imageData;
            });
        }

        async function createGlobe() {
            // Clear previous debug messages
            clearDebug();
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            debug(`Starting globe creation - Canvas: ${width}x${height}`);

            p = new Phenomenon({
                canvas,
                contextType: 'webgl',
                context: {
                    alpha: true,
                    antialias: true,
                    depth: false,
                },
                settings: {
                    clearColor: [0, 0, 0, 0],
                    devicePixelRatio: window.devicePixelRatio || 1,
                }
            });

            debug("Phenomenon created, loading texture...");

            try {
                const earthTexture = await createTexture(p.gl, textureImage);
                debug("Texture loaded, binding to texture unit...");

                // Bind texture to texture unit 0
                p.gl.activeTexture(p.gl.TEXTURE0);
                p.gl.bindTexture(p.gl.TEXTURE_2D, earthTexture);

                debug("Creating globe instance...");

                instance = p.add("globe", {
                    vertex: vertexShader,
                    fragment: fragmentShader,
                    uniforms: {
                        uResolution: {
                            type: "vec2",
                            value: [width, height],
                        },
                        uEarthTexture: {
                            type: "sampler2D",
                            value: 0, // Texture unit 0
                        },
                        phi: { type: "float", value: 0 },
                        theta: { type: "float", value: 0 },
                        dots: { type: "float", value: 25000 },
                        scale: { type: "float", value: 1.2 },
                        dotsBrightness: { type: "float", value: 6 },
                        diffuse: { type: "float", value: 1.2 },
                        dark: { type: "float", value: 1 },
                        opacity: { type: "float", value: 1 },
                        baseColor: { type: "vec3", value: [0.3, 0.6, 1.0] },
                        glowColor: { type: "vec3", value: [0.3, 0.8, 1.0] },
                    },
                    mode: 4, // TRIANGLE_STRIP
                    geometry: {
                        vertices: [
                            { x: -100, y: 100, z: 0 },
                            { x: -100, y: -100, z: 0 },
                            { x: 100, y: 100, z: 0 },
                            { x: 100, y: -100, z: 0 },
                            { x: -100, y: -100, z: 0 },
                            { x: 100, y: 100, z: 0 },
                        ],
                    },
                });

                debug("Globe instance created with texture");
                startAnimation();

            } catch (error) {
                debug("Texture loading failed: " + error.message);
                // Fallback: create a simple procedural Earth texture
                const fallbackTexture = createFallbackTexture(p.gl);
                
                // Bind fallback texture
                p.gl.activeTexture(p.gl.TEXTURE0);
                p.gl.bindTexture(p.gl.TEXTURE_2D, fallbackTexture);
                
                instance = p.add("globe", {
                    vertex: vertexShader,
                    fragment: fragmentShader,
                    uniforms: {
                        uResolution: { type: "vec2", value: [width, height] },
                        uEarthTexture: { type: "sampler2D", value: 0 },
                        phi: { type: "float", value: 0 },
                        theta: { type: "float", value: 0 },
                        dots: { type: "float", value: 25000 },
                        scale: { type: "float", value: 1.2 },
                        dotsBrightness: { type: "float", value: 6 },
                        diffuse: { type: "float", value: 1.2 },
                        dark: { type: "float", value: 1 },
                        opacity: { type: "float", value: 1 },
                        baseColor: { type: "vec3", value: [0.3, 0.6, 1.0] },
                        glowColor: { type: "vec3", value: [0.3, 0.8, 1.0] },
                    },
                    mode: 4,
                    geometry: {
                        vertices: [
                            { x: -100, y: 100, z: 0 },
                            { x: -100, y: -100, z: 0 },
                            { x: 100, y: 100, z: 0 },
                            { x: 100, y: -100, z: 0 },
                            { x: -100, y: -100, z: 0 },
                            { x: 100, y: 100, z: 0 },
                        ],
                    },
                });
                debug("Globe created with fallback procedural texture");
                startAnimation();
            }
        }

        // Create a simple procedural Earth texture as fallback
        function createFallbackTexture(gl) {
            const width = 512;
            const height = 256;
            const data = new Uint8Array(width * height * 4);
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    
                    // Convert to lat/lon with proper orientation
                    const lon = (x / width) * 2 * Math.PI - Math.PI;
                    const lat = ((height - y - 1) / height) * Math.PI - Math.PI / 2; // Flip Y coordinate
                    
                    // Simple land/ocean pattern based on sine waves
                    let land = 0;
                    
                    // Major continents with better distribution
                    land += Math.max(0, Math.sin(lon * 1.8 + 0.5) * Math.cos(lat * 2.5) + 0.3);
                    land += Math.max(0, Math.sin(lon * 2.2 - 1.2) * Math.cos(lat * 1.8 + 0.8) + 0.25);
                    land += Math.max(0, Math.sin(lon * 1.5 + 2.1) * Math.cos(lat * 2.2 - 0.5) + 0.22);
                    
                    // Add some noise for coastlines
                    land += Math.sin(lon * 12) * Math.cos(lat * 15) * 0.08;
                    land += Math.sin(lon * 20) * Math.cos(lat * 18) * 0.05;
                    
                    land = Math.min(1, Math.max(0, land));
                    
                    if (land > 0.4) {
                        // Land - varied greens and browns
                        let landType = Math.sin(lon * 8) * Math.cos(lat * 6) + Math.sin(lon * 15);
                        if (landType > 0.3) {
                            // Forest - dark green
                            data[i] = 34;     // R
                            data[i + 1] = 100; // G  
                            data[i + 2] = 34;  // B
                        } else if (landType > -0.2) {
                            // Grassland - lighter green
                            data[i] = 85;     // R
                            data[i + 1] = 120; // G
                            data[i + 2] = 60;  // B
                        } else {
                            // Desert/mountain - brown
                            data[i] = 160;    // R
                            data[i + 1] = 120; // G
                            data[i + 2] = 80;  // B
                        }
                    } else {
                        // Ocean - varied blues
                        let depth = 1 - land;
                        data[i] = Math.floor(20 + depth * 10);     // R
                        data[i + 1] = Math.floor(50 + depth * 30); // G
                        data[i + 2] = Math.floor(120 + depth * 60); // B
                    }
                    data[i + 3] = 255; // A
                }
            }
            
            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            
            debug("Procedural Earth texture created");
            return texture;
        }

        // Initialize - wait a bit for DOM to be fully ready
        setTimeout(() => {
            createGlobe();
        }, 100);

        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (p && p.uniforms) {
                p.uniforms.uResolution = {
                    type: "vec2",
                    value: [window.innerWidth, window.innerHeight]
                };
            }
        });

        // Animation variables
        let phi = 0;
        let theta = 0;
        let dots = 25000;
        let scale = 1.2;
        let animationStarted = false;

        // Animation loop
        function animate() {
            if (!instance) return;
            
            phi += 0.00;
            
            const uniforms = {
                phi: { type: "float", value: phi },
                theta: { type: "float", value: theta },
                dots: { type: "float", value: dots },
                scale: { type: "float", value: scale },
            };
            
            instance.render(uniforms);
            requestAnimationFrame(animate);
        }

        function startAnimation() {
            if (!animationStarted) {
                animationStarted = true;
                debug("Starting animation...");
                // Hide debug after a few seconds of successful animation
                setTimeout(() => {
                    debugEl.style.display = 'none';
                }, 3000);
                animate();
            }
        }

        // Control handlers
        document.getElementById('phi').addEventListener('input', (e) => {
            phi = parseFloat(e.target.value);
        });

        document.getElementById('theta').addEventListener('input', (e) => {
            theta = parseFloat(e.target.value);
        });

        document.getElementById('dots').addEventListener('input', (e) => {
            dots = parseFloat(e.target.value);
        });

        document.getElementById('scale').addEventListener('input', (e) => {
            scale = parseFloat(e.target.value);
        });

    </script>
</body>
</html>
